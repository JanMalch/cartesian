<pre>{{ model | json }}</pre>
<pre>{{ result | async | json }}</pre>
<form [formGroup]="form" (ngSubmit)="onSubmit(model)">
  <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  <button type="submit" class="btn btn-default">Submit</button>
</form>

<app-result-table
  [cartesianResult]="result | async"
  [extraColumns]="extraColumns()"
  (tableResult)="tableResult.set($event)"
></app-result-table>

<span>Copy markup:</span>
<button matButton="filled" [cdkCopyToClipboard]="markdown()">Markdown</button>
<button matButton="filled" [cdkCopyToClipboard]="atlassian()">Jira/Confluence</button>
