<section id="section-inputs">
  <app-inputs
    [form]="forx.inputs"
    [model]="modex().inputs"
    (modelChange)="updateInputs($event)"
  ></app-inputs>
</section>

<section id="section-results">
  <app-result-table
    [cartesianResult]="result.value() || null"
    [extraColumns]="extraColumns()"
    (tableResult)="tableResult.set($event)"
  ></app-result-table>
</section>

<section id="section-outputs">
  <span>Copy markup:</span>
  <button matButton="filled" [cdkCopyToClipboard]="markdown()">Markdown</button>
  <button matButton="filled" [cdkCopyToClipboard]="atlassian()">Jira/Confluence</button>
</section>
